[project]
name = "health-iq-backend"
version = "0.1.0"
description = "Health IQ hackathon MVP - FastAPI backend (agents, RAG, OCR, PDF, share)."
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "azure-identity>=1.17",
  "azure-storage-blob>=12.22",
  "azure-cosmos>=4.7",
  "aiohttp>=3.10", # required by azure-cosmos's async client transport
  "azure-search-documents>=11.5",
  "azure-ai-documentintelligence>=1.0.0b4",
  "azure-keyvault-secrets>=4.8",
  "openai>=1.40",
  "agent-framework",
  "pyodbc>=5.1",
  "reportlab>=4.2",
  "rapidfuzz>=3.9",
  "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
