<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta
      name="description"
      content="HealthIQ - a health information and doctor-collaboration assistant for prescriptions, lab reports, and meal planning."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>HealthIQ - Smarter health. Better you.</title>
    <script>
      // Set data-theme before first paint so there's no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('healthiq-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. privacy mode) - default light is fine.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
